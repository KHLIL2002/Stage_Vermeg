# LLM API Keys
llm.claude.api-key=none
llm.openai.api-key=none
llm.groq.api-key=none
llm.gemini.api-key=none
llm.azure.api-key=none
llm.azure.endpoint=none
llm.azure.deployment=gpt-4o
llm.mistral.api-key=none
llm.mistral.model=mistral-large-latest

# Server
server.port=8090
spring.threads.virtual.enabled=true

# Database H2
spring.datasource.url=jdbc:h2:mem:stage
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# KeyCloack

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/insurance
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/insurance/protocol/openid-connect/certs

# Keycloak Admin (changement de mot de passe via Admin API)
keycloak.base-url=http://localhost:8180
keycloak.realm=insurance
keycloak.frontend-client-id=insurance-frontend
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=xxxx
keycloak.admin.password=xxxx
llm.groq.model=llama-3.3-70b-versatile